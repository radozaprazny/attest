# Python formatter/linter example — see GUIDE.md (PART 2).
# This file and the PostToolUse hook (.claude/hooks/format_py.py) are one swappable
# unit: the hook lint-fixes imports and formats, this file supplies the rules.
# The hook auto-fixes I001/E401 only — run `ruff check .` for the rest of [lint].
# Using another language? Replace both (prettier + .prettierrc, rustfmt +
# rustfmt.toml, gofmt, ...) and delete this file.

line-length = 100

[lint]
select = ["E", "F", "I"]
