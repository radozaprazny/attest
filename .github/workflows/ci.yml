# ci.yml — attest's OWN gate: the kit that preaches gating gates itself (ADR-0019).
# Runs the same baseline docs/attest-progress.md documents as manual commands:
# ruff, shellcheck, and scripts/smoke.sh.
#
# Hard-guarded to attest itself (github.repository), so in template-generated repos the
# job never runs — and template-cleanup deletes this file there anyway. ci.yml.example
# (all comments) stays the opt-in example for YOUR project's CI; install.sh never
# copies .github/.

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    if: github.repository == 'radozaprazny/attest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: ruff — lint + format check
        run: uvx ruff@0.15.21 check . && uvx ruff@0.15.21 format --check .

      - name: shellcheck — installer + smoke test
        run: uvx --from shellcheck-py shellcheck install.sh scripts/smoke.sh

      - name: smoke — hooks + every install.sh defect class found
        run: ./scripts/smoke.sh
