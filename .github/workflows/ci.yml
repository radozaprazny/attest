# ci.yml — attest's OWN gate: the kit that preaches gating gates itself (ADR-0019).
# Runs the same baseline CLAUDE.md names as manual commands:
# shellcheck and scripts/smoke.sh. There is no linter step for another language because the
# kit no longer contains one: every installed hook is POSIX sh, and install.sh plus scripts/*.sh
# are bash that runs once at the author's keyboard — shellcheck covers all of them (ADR-0027).
#
# Hard-guarded to attest itself (github.repository), so a fork's copy never runs. install.sh
# copies nothing at all from .github/: none of it is written for the consumer (ADR-0031).
#
# Actions are pinned by commit SHA, not by tag: a tag is mutable, so `@v4` is a promise that
# whoever controls the tag runs arbitrary code in this job. The trailing comment names the
# version each SHA is: a gate that lints the kit is not a place for a moving dependency.

name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default — no step here needs to write to the repo.
permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'radozaprazny/attest'
    # Branch protection requires the check named `check`: the ubuntu entry keeps that name.
    name: ${{ matrix.os == 'ubuntu-latest' && 'check' || format('check ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: shellcheck — installer, hooks, smoke test
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck install.sh scripts/*.sh .claude/hooks/*.sh

      # On ubuntu the hooks must run under dash, the strictest common /bin/sh.
      - name: smoke — hooks and install.sh
        run: ./scripts/smoke.sh
        env:
          ATTEST_SMOKE_WANT_SH: ${{ matrix.os == 'ubuntu-latest' && 'dash' || '' }}
