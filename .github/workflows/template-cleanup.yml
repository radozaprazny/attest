# template-cleanup — runs ONCE in a repo generated from the attest template button and
# removes everything that is attest's identity, not the user's project: attest's own docs,
# its smoke test, install.sh, attest's CI, its README and its LICENSE. Then it deletes the
# cleanup script and itself. It leaves COMPLIANCE.md and .claude/skills/compliance/ in place
# even though install.sh does not ship them by default: a generated repo has no installer to
# re-run, so /business rules on them instead (attest ADR-0030).
#
# The work lives in scripts/template-cleanup.sh, not inline here, so that the only
# destructive code in the repo is shellcheck'd by CI and exercised by scripts/smoke.sh
# before it ever runs in someone's repo (attest ADR-0022). Each destructive act in it is
# guarded by a content check on its own target, so a late run cannot take your files with it.
#
# Job guards: the two from attest ADR-0012, a fork check, and a null check on the payload —
# is_template stays false in generated repos but is one GitHub toggle away from false in
# attest itself, so the hard repo-name check is what actually protects attest's own files,
# and the fork check keeps the workflow inert in forks. workflow_dispatch is the fallback:
# repo-creation pushes do not reliably fire.

name: template-cleanup
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes must not race each other into a rejected push. Queue, never cancel: a
# cancelled run could leave the cleanup half-committed.
concurrency:
  group: template-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository != 'radozaprazny/attest' &&
      github.event.repository != null &&
      github.event.repository.is_template == false &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not by tag: this is the workflow that carries a write token
      # and pushes a commit into someone else's repo, so a mutable tag is the last thing it
      # should resolve through.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Remove attest's own files
        run: |
          # The script may already be gone — README tells users they may delete scripts/ by
          # hand, and a workflow that only fires on their first push can arrive after that.
          # Without this guard the step exits 127, the commit step below never runs, and the
          # workflow can never delete itself: it would fail on every push forever (ADR-0022).
          if [ -f scripts/template-cleanup.sh ]; then
            bash scripts/template-cleanup.sh
          else
            echo "cleanup script already removed — this run only deletes the workflow"
          fi

      - name: Remove the cleanup itself, then commit
        run: |
          # Deleted here rather than by the script: a script that unlinks itself while bash
          # is still reading it is not something to rely on.
          rm -f scripts/template-cleanup.sh .github/workflows/template-cleanup.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit — the cleanup had already run"
            exit 0
          fi
          git commit -m "chore: template cleanup — remove attest's own identity files"
          # A queued second run committed on top of an older checkout: rebase rather than
          # fail the run red on a non-fast-forward push.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
